<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>教务助手 · 课表</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color-scheme:light dark;--bg:oklch(0.963 0.009 298);--ink:oklch(0.255 0.026 303);--muted:oklch(0.463 0.038 304);--accent:oklch(0.48 0.101 305);--surface:oklch(1 0 0/.76);--line:oklch(0.3 0.025 305/.13);--active:oklch(0.91 0.035 305);--error:#a32949}
@media(prefers-color-scheme:dark){:root{--bg:oklch(0.245 0.02 300);--ink:oklch(0.963 0.009 298);--muted:oklch(0.8 0.022 305);--accent:oklch(0.803 0.094 305);--surface:oklch(0.3 0.022 305/.86);--line:oklch(0.97 0.02 305/.13);--active:oklch(0.37 0.054 305);--error:#ffa9be}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;-webkit-text-size-adjust:100%}button,select,input{font:inherit}button,select{min-height:44px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}header{padding:calc(20px + env(safe-area-inset-top)) 22px 12px;max-width:720px;margin:auto}h1{font-size:30px;letter-spacing:-.025em;margin:0 0 6px}h2{font-size:19px;margin:0 0 8px}p{line-height:1.5}#subtitle,.muted{color:var(--muted);font-size:13px}#subtitle{margin:0}nav{position:sticky;top:0;background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:2;border-bottom:1px solid var(--line);padding:7px max(16px,env(safe-area-inset-left));display:flex;justify-content:center;gap:3px}nav button{border:0;background:none;color:var(--muted);padding:0 10px;font-size:15px;border-radius:9px;flex:1;max-width:125px;white-space:nowrap}nav button[aria-selected=true]{background:var(--active);color:var(--ink);font-weight:600}main{max-width:720px;margin:auto;padding:22px max(22px,env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom))}#content{animation:appear .18s ease-out}@keyframes appear{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){#content{animation:none}}
.day{margin:24px 0 8px;display:flex;align-items:baseline;gap:9px}.day:first-child{margin-top:0}.day small{color:var(--muted);font-size:13px}.course{display:flex;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.clock{flex:0 0 52px;font-size:17px;font-variant-numeric:tabular-nums;font-weight:600}.clock small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:5px}.info{min-width:0;flex:1}.info h3{font-size:17px;line-height:1.35;margin:0 0 7px;overflow-wrap:anywhere}.info p{margin:3px 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}.state{display:inline-flex;gap:5px;align-items:center;color:var(--accent);font-size:12px;font-weight:600;margin-bottom:5px}.state:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.note{padding:13px 15px;background:var(--active);border-radius:12px;font-size:14px;line-height:1.5;margin:0 0 18px}.empty{padding:28px 0}.empty h2{font-size:21px}.empty p{font-size:15px;color:var(--muted)}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tools select,.tools input{max-width:100%;flex:1;min-width:110px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}.actions button{border:0;border-radius:10px;background:var(--active);color:var(--accent);text-align:left;padding:12px 15px}.grade{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.score{margin-left:auto;font-size:23px;font-weight:600;color:var(--accent);flex-shrink:0}.failed{color:var(--error)}.grade .info p{font-size:13px}.term-course{padding:16px 0;border-bottom:1px solid var(--line)}.term-course h3{font-size:17px;margin:0 0 7px;overflow-wrap:anywhere}.term-course p{margin:3px 0;font-size:14px;color:var(--muted)}footer{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.5}a{color:var(--accent)}@media(max-width:350px){header,main{padding-left:16px;padding-right:16px}nav{padding-left:8px;padding-right:8px}nav button{padding:0 8px;font-size:14px}.course{gap:12px}}
</style>
</head>
<body>
<header><h1>课表</h1><p id="subtitle"></p></header>
<nav aria-label="课表视图" role="tablist"><button data-tab="today" role="tab">今天</button><button data-tab="tomorrow" role="tab">明天</button><button data-tab="week" role="tab">本周</button><button data-tab="term" role="tab">学期</button><button data-tab="grades" role="tab">成绩</button></nav>
<main><div id="content" role="tabpanel"></div><footer id="foot"></footer></main>
<script>
/* __MOBILE_CORE__ */
const data = IMNUScheduleCore.validate(/* __MOBILE_DATA__ */);
const nativeHost = /* __MOBILE_HOST__ */;
const Core = IMNUScheduleCore;
let now = new Date(), today = Core.dayKey(now), tab = 'today';
const e = value => String(value ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
function dateText(iso){if(!iso || !Number.isFinite(Date.parse(iso)))return '未知';return new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'}).format(new Date(iso))}
function empty(title,body){return `<div class="empty"><h2>${e(title)}</h2><p>${e(body)}</p></div>`}
function courseHTML(course,key){const t=Core.times(course),r=Core.interval(course,key),live=r&&r.start<=now&&now<r.end;return `<article class="course"><div class="clock">${e(t?t.start:'待确认')}<small>${e(t?t.end:`${course.startSection}–${course.endSection}节`)}</small></div><div class="info">${live?'<div class="state">正在上课</div>':''}<h3>${e(course.name)}</h3><p>${e(course.location||'教室待公布')}</p><p>${e(course.teacher||'教师待公布')} · 第${course.startSection}${course.endSection!==course.startSection?'–'+course.endSection:''}节</p></div></article>`}
function dayHTML(key){const week=Core.weekAt(data,key),courses=Core.coursesOn(data,key);const heading=`<div class="day"><h2>${e(Core.labelFor(key,today))} · 周${Core.weekdays[Core.weekday(key)-1]}</h2><small>${e(key.slice(5).replace('-','/'))}</small></div>`;if(week===null)return heading+empty('教学周待确认','本地数据没有有效的当前教学周，或已超出学期范围。请在电脑同步后更新手机课表。');return heading+(courses.length?courses.map(c=>courseHTML(c,key)).join(''):empty('这一天没有课','下课后的时间，留给自己安排。'))}
function termHTML(){return `<div class="tools"><label for="course-search" class="muted">查找课程</label><input id="course-search" placeholder="课程、教室或教师" type="search"></div><div id="term-list"></div>`}
function renderTerm(){const query=document.querySelector('#course-search').value.trim().toLowerCase();const rows=data.courses.filter(c=>[c.name,c.location,c.teacher].some(v=>v.toLowerCase().includes(query))).sort((a,b)=>a.weekday-b.weekday||a.startSection-b.startSection);document.querySelector('#term-list').innerHTML=rows.length?rows.map(c=>{const t=Core.times(c);return `<article class="term-course"><h3>${e(c.name)}</h3><p>周${Core.weekdays[c.weekday-1]} · ${e(t?t.start+'–'+t.end:`第${c.startSection}–${c.endSection}节`)} · ${e(c.weeks||'周次待确认')}</p><p>${e(c.location||'教室待公布')} · ${e(c.teacher||'教师待公布')}</p></article>`}).join(''):empty('没有找到课程','试试课程名称、教室或老师的名字。')}
function gradesHTML(){const terms=[...new Set(data.grades.map(g=>g.term))].sort().reverse();return `<div class="tools"><label for="grade-term" class="muted">学期</label><select id="grade-term"><option value="">全部学期</option>${terms.map(t=>`<option value="${e(t)}">${e(t)}</option>`).join('')}</select></div><p class="muted">${data.gpa?'绩点 '+e(data.gpa)+' · ':''}成绩更新 ${e(dateText(data.gradesUpdatedAt))}</p><div id="grade-list"></div>`}
function renderGrades(){const term=document.querySelector('#grade-term').value,rows=data.grades.filter(g=>!term||g.term===term);document.querySelector('#grade-list').innerHTML=rows.length?rows.map(g=>{const score=Number(g.score),fail=g.score.trim()!==''&&Number.isFinite(score)&&score<60;return `<article class="grade"><div class="info"><h3>${e(g.courseName)}</h3><p>${e(g.term)} · ${e(g.credit||'—')} 学分 · ${e(g.courseNature||'')}</p></div><div class="score${fail?' failed':''}">${e(g.score||'—')}</div></article>`}).join(''):empty('暂无成绩缓存','电脑同步成绩后，重新导出手机数据即可查看。')}
function action(name){location.href='imnuwidget://'+name}
function render(){const week=Core.weekAt(data,today);document.querySelector('#subtitle').textContent=`${data.term||'教务助手'} · ${week===null?'教学周待确认':'第 '+week+' 周'}`;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));const age=Core.staleDays(data,now);let html=age!==null&&age>=7?`<div class="note">课表已有 ${age} 天未更新。临时调课请以学校通知为准；可在 Scriptable 中导入新数据。</div>`:'';if(tab==='today'||tab==='tomorrow')html+=dayHTML(tab==='today'?today:Core.addDays(today,1));if(tab==='week'){const mon=Core.addDays(today,1-Core.weekday(today));html+=Array.from({length:7},(_,i)=>dayHTML(Core.addDays(mon,i))).join('')}if(tab==='term')html+=termHTML();if(tab==='grades')html+=gradesHTML();const content=document.querySelector('#content');content.innerHTML=html;content.style.animation='none';void content.offsetHeight;content.style.animation='';if(tab==='term'){renderTerm();document.querySelector('#course-search').addEventListener('input',renderTerm)}if(tab==='grades'){renderGrades();document.querySelector('#grade-term').addEventListener('change',renderGrades)}document.querySelector('#foot').innerHTML=`课表更新 ${e(dateText(data.updatedAt))}<br>上课时间采用内师大教务课表的大节时间；手机数据离线保存。`+(nativeHost?`<div class="actions"><button id="import-data">导入电脑更新的课表</button><button id="preview-widget">预览小组件</button><button id="portal">打开学校教务官网</button></div>`:`<p>这是备用离线查看页面。添加、预览小组件和更新课表请在 Scriptable 中运行“内师大课表”。</p>`);if(nativeHost){document.querySelector('#import-data').onclick=()=>action('import');document.querySelector('#preview-widget').onclick=()=>action('preview');document.querySelector('#portal').onclick=()=>action('portal')}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})});render();
setInterval(()=>{if(tab==='today'&&!(document.activeElement instanceof HTMLInputElement)){now=new Date();today=Core.dayKey(now);render()}},60000);
</script>
</body></html>
